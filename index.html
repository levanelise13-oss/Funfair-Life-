<style>
/* Concept : un seul monde nocturne plein écran, interface en billets de fête foraine. */
:root{
  --night:#140d26; --ink:#1d1330; --ticket:#fff1cf; --red:#e8392b; --gold:#ffbf2f; --teal:#27c2b0; --plum:#4a2a6e; --mute:#b9a9d6;
  --display:"Alfa Slab One",Georgia,"Times New Roman",serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ticket);font-family:var(--body);font-size:16px;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;justify-content:space-between}
#hud button,#hud .ui{pointer-events:auto}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ticket{background:var(--ticket);color:var(--ink);border-radius:6px;padding:6px 14px 6px 22px;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 0 50%,#0000 98%,#000) ;mask:radial-gradient(circle 6px at 0 50%,#0000 98%,#000);
  box-shadow:0 4px 0 #0005}
.ticket small{display:block;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a5a3a}
.ticket b{font-family:var(--display);font-size:26px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.ticket.bump b{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25);color:var(--red)}}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:700 15px var(--body);letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:999px;padding:10px 16px;min-height:42px;background:#ffffff1c;color:var(--ticket);cursor:pointer;backdrop-filter:blur(6px);border:1px solid #ffffff33}
.btn:hover{background:#ffffff33}
.btn:focus-visible,.cta:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.cta{font:400 20px var(--display);border:0;border-radius:10px;padding:12px 22px;min-height:48px;background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #a8730a;letter-spacing:.02em}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #a8730a}
.cta[disabled]{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
.cta.alt{background:var(--teal);box-shadow:0 5px 0 #14776b}
#gamebar{display:none;flex-direction:column;align-items:center;gap:6px;text-align:center;flex:1;min-width:0}
#gtitle{font:400 22px var(--display);text-shadow:0 2px 0 #000a;color:var(--gold)}
#gstatus{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;background:#140d26cc;border-radius:999px;padding:4px 14px}
#ghint{font-size:15px;color:var(--ticket);background:#140d26aa;border-radius:8px;padding:4px 12px;max-width:min(520px,100%)}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#prompt{display:none;margin:0 auto;align-items:center;gap:14px;background:#140d26dd;border:1px solid #ffffff30;border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px)}
#prompt b{font:400 18px var(--display);display:block;color:var(--gold)}
#prompt span{font-size:14px;color:var(--mute)}
kbd{font:700 12px var(--body);background:#ffffff22;border-radius:4px;padding:1px 6px;border:1px solid #ffffff44}
#power{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(260px,60vw);height:14px;border-radius:9px;background:#140d26cc;border:2px solid var(--ticket);transform:translateX(-50%);display:none;overflow:hidden}
#power,#meter{pointer-events:none}
#power i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold),var(--red))}
#meter{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));width:min(320px,70vw);height:22px;border-radius:12px;background:#140d26cc;border:2px solid var(--ticket);transform:translateX(-50%);display:none;overflow:hidden}
#meter u{position:absolute;top:0;bottom:0;left:39%;width:22%;background:#27c2b088;border-left:2px solid var(--teal);border-right:2px solid var(--teal)}
#meter i{position:absolute;top:2px;bottom:2px;width:10px;margin-left:-5px;border-radius:5px;background:var(--gold)}
#reticle{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid #fff;border-radius:50%;display:none;pointer-events:none;box-shadow:0 0 0 1px #000a,inset 0 0 0 1px #000a}
#reticle:before,#reticle:after{content:"";position:absolute;background:#fff;left:50%;top:50%}
#reticle:before{width:2px;height:12px;margin:-6px 0 0 -1px}
#reticle:after{width:12px;height:2px;margin:-1px 0 0 -6px}
#toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.toast{background:var(--ticket);color:var(--ink);font:700 16px var(--body);padding:8px 16px;border-radius:999px;box-shadow:0 4px 0 #0006;animation:tin .25s,tout .4s 2.4s forwards}
.toast.good{background:var(--gold)}.toast.bad{background:var(--red);color:#fff}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.float{position:fixed;font:400 26px var(--display);color:var(--gold);text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;animation:fl 1.3s ease-out forwards;z-index:4;transform:translate(-50%,-50%)}
.float.zero{color:#ddd;font-size:20px}
@keyframes fl{to{transform:translate(-50%,-190%);opacity:0}}
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff44;display:none;touch-action:none;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--ticket);opacity:.85;box-shadow:0 3px 0 #0006}
#act{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;font:400 17px var(--display);display:none;box-shadow:0 6px 0 #8a1c12;pointer-events:auto;touch-action:none}
#act:active{transform:translateY(4px);box-shadow:0 2px 0 #8a1c12}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0618cc;backdrop-filter:blur(4px);z-index:10;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#card{background:var(--ticket);color:var(--ink);border-radius:14px;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;box-shadow:0 10px 0 #0007;touch-action:pan-y}
#card h2{font:400 30px var(--display);margin:0 0 6px;line-height:1.1}
#card p{margin:6px 0;line-height:1.35;font-size:17px;font-weight:500}
#card .sub{color:#6b4d2e;font-weight:600}
.big{font:400 54px var(--display);color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.big.neg{color:#6b4d2e}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.lot{border:2px dashed #b8895a;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff8e6;min-width:0}
.lot .sw{height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:400 15px var(--display);color:#fff;text-shadow:0 1px 0 #0006}
.lot b{font-size:17px}.lot em{font-style:normal;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.lot .cta{font-size:15px;min-height:40px;padding:8px 12px}
.owned{font-weight:700;color:#14776b}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 110%,#e8751f 0,#8a2f6a 35%,#140d26 75%);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#intro .in{max-width:620px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#intro h1{font:400 clamp(40px,9vw,84px)/.95 var(--display);margin:0;color:var(--gold);text-shadow:0 4px 0 #8a1c12,0 8px 0 #0006;text-wrap:balance}
#intro p{margin:0;font-size:18px;line-height:1.4}
#intro .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%;font-size:15px;text-align:left}
#intro .keys div{background:#0004;border-radius:10px;padding:8px 12px}
#intro .keys b{display:block;color:var(--gold);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
#loading{font-size:14px;color:var(--mute)}
@media (max-height:520px){#card{padding:14px}#card h2{font-size:24px}.big{font-size:40px}}
@media (prefers-reduced-motion:reduce){.toast,.float{animation-duration:.01s}}
</style>

<div id="hud">

<div id="intro"><div class="in">
  <h1>Fête<br>Foraine</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
function boot(){'use strict';
/* ============ Outils ============ */
const $=s=>document.querySelector(s);
const V3=THREE.Vector3, PI=Math.PI;
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>n.toFixed(2).replace('.',',')+' €';
const mobile=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||innerWidth<700;
const SAVE_KEY='fete-foraine-v1';
const S={money:20,inv:{},mode:'intro',won:0};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({money:S.money,inv:S.inv,won:S.won}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&typeof d.money==='number'){S.money=d.money;S.inv=d.inv||{};S.won=d.won||0}}catch(e){}}

/* ============ Sons synthétisés ============ */
let AC=null,soundOn=true;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,slide){if(!soundOn)return;const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol,freq){if(!soundOn)return;const a=audio();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1000;const g=a.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const sfx={
  shot(){noise(.2,.4,900);tone(150,.14,'square',.1,-100)},
  coin(){tone(988,.08,'square',.08);setTimeout(()=>tone(1319,.2,'square',.08),75)},
  ping(){tone(1500,.12,'triangle',.12,-400)},
  bump(v){noise(.14,clamp(.1+v*.05,.1,.4),260);tone(90,.14,'sine',.2,-40)},
  splash(){noise(.3,.14,2400)},
  lose(){tone(240,.35,'sawtooth',.08,-120)},
  tick(){tone(1200,.03,'square',.04)},
  thud(){tone(110,.1,'sine',.22,-50)},
  pop(){tone(500,.07,'triangle',.12,260)},
  buy(){tone(660,.08,'square',.07);setTimeout(()=>tone(880,.08,'square',.07),70);setTimeout(()=>tone(1175,.16,'square',.07),140)},
  motor(){tone(70,.12,'sawtooth',.03,10)}
};
/* orgue de barbarie, très discret */
let musicTimer=null,mi=0;
const MEL=[523,659,784,659,523,659,784,1047,988,784,659,784,698,880,1047,880,784,659,523,0,587,698,880,698,587,698,880,1175,1047,784,659,523];
function music(on){clearInterval(musicTimer);musicTimer=null;if(!on)return;musicTimer=setInterval(()=>{if(!soundOn||S.mode==='intro')return;const n=MEL[mi%MEL.length];if(n)tone(n,.22,'square',.012);if(mi%4===0)tone(n?n/4:130,.3,'triangle',.03);mi++},260)}

/* ============ Textures procédurales ============ */
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.encoding=THREE.sRGBEncoding;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
function stripeTex(c1,c2,n,rx){return ctex(256,64,(x,w,h)=>{const s=w/n;for(let i=0;i<n;i++){x.fillStyle=i%2?c2:c1;x.fillRect(i*s,0,s+1,h)}},[rx||1,1])}
function gravelTex(base,rep){return ctex(512,512,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<9000;i++){const v=Math.random()*60-30;x.fillStyle='rgba('+(v>0?255:0)+','+(v>0?240:0)+','+(v>0?220:0)+','+Math.abs(v)/160+')';x.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}},rep)}
function pavTex(rep){return ctex(512,512,(x,w,h)=>{x.fillStyle='#6d6672';x.fillRect(0,0,w,h);const n=8,s=w/n;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const v=Math.floor(rnd(90,128));x.fillStyle='rgb('+v+','+(v-4)+','+(v+6)+')';x.fillRect(i*s+(j%2?s/2:0)%w+1.5,j*s+1.5,s-3,s-3);if(j%2)x.fillRect(i*s-s/2+1.5,j*s+1.5,s-3,s-3)}for(let i=0;i<4000;i++){x.fillStyle='rgba(0,0,0,'+Math.random()*.12+')';x.fillRect(Math.random()*w,Math.random()*h,2,2)}},rep)}
function woodTex(base,rep){return ctex(256,256,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<7;i++){x.fillStyle='rgba(0,0,0,.28)';x.fillRect(0,i*(h/7),w,2)}for(let i=0;i<260;i++){x.strokeStyle='rgba(60,30,10,'+Math.random()*.18+')';x.beginPath();const y=Math.random()*h;x.moveTo(0,y);x.lineTo(w,y+rnd(-3,3));x.stroke()}},rep)}
function signTex(text,bg,fg,sub){return ctex(1024,256,(x,w,h)=>{x.fillStyle=bg;x.fillRect(0,0,w,h);x.strokeStyle=fg;x.lineWidth=10;x.strokeRect(16,16,w-32,h-32);x.lineWidth=3;x.strokeRect(34,34,w-68,h-68);x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';let fs=sub?118:136;const fam='"Alfa Slab One",Georgia,serif';do{x.font='400 '+fs+'px '+fam;fs-=4}while(x.measureText(text).width>w-120&&fs>30);x.fillText(text,w/2,sub?108:h/2+4);if(sub){x.font='700 40px "Barlow Semi Condensed",Arial,sans-serif';x.fillText(sub,w/2,196)}})}
function labelTex(text,bg,fg,w,h){return ctex(w||256,h||128,(x,W,H)=>{x.fillStyle=bg;x.fillRect(0,0,W,H);x.strokeStyle=fg;x.lineWidth=6;x.strokeRect(6,6,W-12,H-12);x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';let fs=H*.6;do{x.font='400 '+fs+'px "Alfa Slab One",Georgia,serif';fs-=3}while(x.measureText(text).width>W-24&&fs>12);x.fillText(text,W/2,H/2+2)})}
function glowTex(){return ctex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,230,170,1)');g.addColorStop(.25,'rgba(255,190,90,.5)');g.addColorStop(1,'rgba(255,160,60,0)');x.fillStyle=g;x.fillRect(0,0,64,64)})}

/* ============ Maillages ============ */
function mat(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.05},o||{}))}
function shade(m,cast,recv){m.castShadow=cast!==false;m.receiveShadow=recv!==false;return m}
function bx(w,h,d,m){return shade(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m))}
function cy(rt,rb,h,m,seg){return shade(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||20),m))}
function sp(r,m,seg){return shade(new THREE.Mesh(new THREE.SphereGeometry(r,seg||18,seg?Math.max(8,seg*.7|0):12),m))}
function at(o,x,y,z,parent){o.position.set(x,y,z);if(parent)parent.add(o);return o}
const GLOW=glowTex?null:null;

/* ============ Rendu, scène, lumières ============ */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!mobile,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,mobile?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x4a3566,0.0105);
const camera=new THREE.PerspectiveCamera(58,1,.1,600);scene.add(camera);
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

const hemi=new THREE.HemisphereLight(0xa59bf0,0x4a3a3a,1.05);scene.add(hemi);
const moon=new THREE.DirectionalLight(0xb9c6ff,.95);moon.castShadow=true;
moon.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);
const sc=moon.shadow.camera;sc.left=-36;sc.right=36;sc.top=36;sc.bottom=-36;sc.near=1;sc.far=140;moon.shadow.bias=-.0006;
scene.add(moon);scene.add(moon.target);
/* Réserve de lumières chaudes : repositionnées chaque image sur les stands les plus proches */

const COL=[];
function addCircleCol(x,z,r){COL.push({t:'c',x,z,r})}
function addBoxCol(g,cx,cz,hx,hz){COL.push({t:'b',g,cx,cz,hx,hz,cos:Math.cos(g.rotation.y),sin:Math.sin(g.rotation.y)})}
function resolve(p,r){
  for(const c of COL){
    if(c.t==='c'){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+r;if(d<m&&d>1e-4){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m}}
    else{const gx=c.g.position.x,gz=c.g.position.z,dx=p.x-gx,dz=p.z-gz;
      const lx=dx*c.cos-dz*c.sin,lz=dx*c.sin+dz*c.cos,rx=lx-c.cx,rz=lz-c.cz,ex=c.hx+r,ez=c.hz+r;
      if(Math.abs(rx)<ex&&Math.abs(rz)<ez){let nx=lx,nz=lz;
        if(ex-Math.abs(rx)<ez-Math.abs(rz))nx=c.cx+(rx<0?-ex:ex);else nz=c.cz+(rz<0?-ez:ez);
        p.x=gx+nx*c.cos+nz*c.sin;p.z=gz-nx*c.sin+nz*c.cos}}}
}

  begin(){this.left=3;this.t=0;this.fly=null;this.endT=-1;this.sum=0;this.stuck.children.slice().forEach(c=>this.stuck.remove(c));this.stuck.clear&&0;hudStatus('Fléchettes : 3');hudHint('Vise avec la souris et clique pour lancer. Sur mobile : glisse, relâche pour lancer.')},

function explore(dt){
  const a=IN.axes(),f=new V3(-Math.sin(orbit.yaw),0,-Math.cos(orbit.yaw)),r=new V3(f.z*-1,0,f.x),mv=new V3().addScaledVector(f,a.y).addScaledVector(r,a.x),m=mv.length();

  if(m>.05){mv.normalize();player.pos.x+=mv.x*spd*dt;player.pos.z+=mv.z*spd*dt;player.rot+=clamp(angDiff(player.rot,Math.atan2(mv.x,mv.z)),-9*dt,9*dt)}

  player.g.position.copy(player.pos);player.g.rotation.y=player.rot;player.spd=spd;walkAnim(player,spd,dt);
  const d=player.pos.clone().add(new V3(0,1.5,0)),cp=Math.cos(orbit.pitch),want=new V3(d.x+Math.sin(orbit.yaw)*cp*orbit.dist,d.y+Math.sin(orbit.pitch)*orbit.dist,d.z+Math.cos(orbit.yaw)*cp*orbit.dist);
  if(want.y<.5)want.y=.5;camGoal.pos.copy(want);camGoal.look.copy(d);camGoal.fov=58;
  let near=null,nd=2.7;for(const g of G.list){const s=g.stand;if(!s)continue;const dd=Math.hypot(s.x-player.pos.x,s.z-player.pos.z);if(dd<nd){nd=dd;near=g}}setNear(near);return spd}
